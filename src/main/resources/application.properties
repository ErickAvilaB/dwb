spring.application.name=product

spring.datasource.url=jdbc:mysql://localhost:3306/product_db
spring.datasource.username=product_user
spring.datasource.password=product_password

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Directorio para imágenes de productos (C11 y C12).
app.upload.dir=uploads
app.upload.images=img

# Clave fija opcional para conservar los JWT entre reinicios o compartirlos con Auth.
app.jwt.secret=${JWT_SECRET:}
app.auth.admin.username=${AUTH_ADMIN_USERNAME:}
app.auth.admin.password=${AUTH_ADMIN_PASSWORD:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-auth.sql
